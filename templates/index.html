<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaSmart | Ultra Pro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #050b14;
            --glass-bg: rgba(13, 25, 48, 0.45);
            --glass-border: rgba(0, 243, 255, 0.15);
            --neon-cyan: #00f3ff;
            --neon-green: #00ff88;
            --neon-red: #ff003c;
            --text-main: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 0%, #0d1e38 0%, var(--bg-deep) 70%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2vw;
            overflow-x: hidden;
        }

        /* Animated Background Particles Grid */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px; z-index: -1;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* Glowing Header */
        .header {
            text-align: center; margin-bottom: 40px; position: relative;
        }
        .header h1 {
            font-family: 'Orbitron', sans-serif; font-size: clamp(1.8rem, 4vw, 3rem);
            color: #fff; text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.5); margin-bottom: 10px;
        }
        .live-status {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.05); padding: 5px 15px; border-radius: 20px;
            border: 1px solid rgba(0, 243, 255, 0.2);
        }
        .pulse-dot {
            width: 10px; height: 10px; background: var(--neon-cyan);
            border-radius: 50%; box-shadow: 0 0 10px var(--neon-cyan);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }

        /* Auto Mode Switch - Ultra UI */
        .mode-container {
            display: flex; justify-content: center; margin-bottom: 40px;
        }
        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 15px;
            padding: 15px 30px; display: flex; align-items: center; gap: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .glass-panel h3 { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: #fff; }
        
        .cyber-switch { position: relative; display: inline-block; width: 64px; height: 32px; }
        .cyber-switch input { opacity: 0; width: 0; height: 0; }
        .cyber-slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
            transition: .4s; border-radius: 32px; overflow: hidden;
        }
        .cyber-slider:before {
            position: absolute; content: ""; height: 24px; width: 24px; left: 3px; bottom: 3px;
            background-color: var(--text-main); transition: .4s; border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        input:checked + .cyber-slider { background-color: rgba(0, 255, 136, 0.2); border-color: var(--neon-green); }
        input:checked + .cyber-slider:before {
            transform: translateX(32px); background-color: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
        }

        /* Grid Layout */
        .grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; margin-bottom: 40px;
        }

        /* Glassmorphism Cards */
        .sensor-card {
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 25px 20px; text-align: center; position: relative; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .sensor-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(0,243,255,0.1) 0%, transparent 60%);
            opacity: 0; transition: opacity 0.4s ease; z-index: 0; pointer-events: none;
        }
        .sensor-card:hover { transform: translateY(-10px); border-color: var(--neon-cyan); box-shadow: 0 15px 40px rgba(0, 243, 255, 0.15); }
        .sensor-card:hover::before { opacity: 1; }
        
        .sensor-card i { font-size: 2.5rem; color: var(--neon-cyan); margin-bottom: 15px; position: relative; z-index: 1; text-shadow: 0 0 15px rgba(0,243,255,0.4); }
        .sensor-card h4 { font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; position: relative; z-index: 1; }
        .sensor-card .value { font-family: 'Orbitron', sans-serif; font-size: 2.5rem; font-weight: 700; color: #fff; position: relative; z-index: 1; }
        .sensor-card .unit { font-size: 1rem; color: #64748b; font-family: 'Inter', sans-serif; }

        /* Actuators Control */
        .controls-wrapper {
            background: var(--glass-bg); backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px; text-align: center;
        }
        .controls-wrapper h3 { font-family: 'Orbitron', sans-serif; color: #fff; margin-bottom: 25px; font-size: 1.5rem; }
        .control-btns { display: flex; justify-content: center; gap: 25px; flex-wrap: wrap; }
        
        .cyber-btn {
            position: relative; padding: 15px 35px; font-family: 'Rajdhani', sans-serif; font-size: 1.2rem;
            font-weight: 700; letter-spacing: 1px; border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; gap: 10px; transition: all 0.3s;
            overflow: hidden; z-index: 1; text-transform: uppercase;
        }
        
        .btn-off {
            background: rgba(255, 0, 60, 0.1); border: 1px solid var(--neon-red); color: var(--neon-red);
            box-shadow: 0 0 15px rgba(255,0,60,0.1);
        }
        .btn-off:hover:not(:disabled) { background: rgba(255, 0, 60, 0.2); box-shadow: 0 0 25px rgba(255,0,60,0.3); }
        
        .btn-on {
            background: rgba(0, 255, 136, 0.1); border: 1px solid var(--neon-green); color: var(--neon-green);
            box-shadow: 0 0 15px rgba(0,255,136,0.1);
        }
        .btn-on:hover:not(:disabled) { background: rgba(0, 255, 136, 0.2); box-shadow: 0 0 25px rgba(0,255,136,0.3); }

        .cyber-btn:disabled {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #475569; cursor: not-allowed; box-shadow: none;
        }

        .overlay-msg {
            color: #f59e0b; font-family: 'Rajdhani', sans-serif; font-size: 1.1rem;
            margin-top: 20px; font-weight: 600; letter-spacing: 0.5px;
            animation: pulseText 2s infinite; display: none;
        }
        @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>AquaSmart Core</h1>
            <div class="live-status">
                <div class="pulse-dot"></div> Live Telemetry Sync: <span id="sync-time" style="color:#fff;">--:--:--</span>
            </div>
        </div>

        <!-- Auto Mode Switch -->
        <div class="mode-container">
            <div class="glass-panel">
                <h3><i class="fa-solid fa-microchip"></i> OVERRIDE PROTOCOL: <span id="mode-text" style="color: var(--neon-cyan);">AUTO</span></h3>
                <label class="cyber-switch">
                    <input type="checkbox" id="auto-mode-toggle" onchange="toggleAutoMode()">
                    <span class="cyber-slider"></span>
                </label>
            </div>
        </div>

        <!-- Sensor Grid -->
        <div class="grid">
            <div class="sensor-card">
                <i class="fa-solid fa-vial"></i>
                <h4>Water pH</h4>
                <div class="value" id="val-ph">--</div>
            </div>
            <div class="sensor-card">
                <i class="fa-solid fa-wind"></i>
                <h4>Dissolved O2</h4>
                <div class="value" id="val-do">-- <span class="unit">mg/L</span></div>
            </div>
            <div class="sensor-card">
                <i class="fa-solid fa-water-arrow-down"></i>
                <h4>Turbidity</h4>
                <div class="value" id="val-turb">-- <span class="unit">NTU</span></div>
            </div>
            <div class="sensor-card">
                <i class="fa-solid fa-temperature-half"></i>
                <h4>Temperature</h4>
                <div class="value" id="val-temp">-- <span class="unit">°C</span></div>
            </div>
            <div class="sensor-card">
                <i class="fa-solid fa-wave-square"></i>
                <h4>Acoustics</h4>
                <div class="value" id="val-sound" style="font-size: 2rem; margin-top: 5px;">--</div>
            </div>
        </div>

        <!-- Actuators Control -->
        <div class="controls-wrapper">
            <h3><i class="fa-solid fa-gamepad"></i> MANUAL ACTUATORS</h3>
            <div class="control-btns">
                <button id="feeder-btn" class="cyber-btn btn-off" onclick="toggleDevice('feeder')">
                    <i class="fa-solid fa-power-off"></i> Feeder: OFF
                </button>
                <button id="aerator-btn" class="cyber-btn btn-off" onclick="toggleDevice('aerator')">
                    <i class="fa-solid fa-power-off"></i> Aerator: OFF
                </button>
            </div>
            <div id="auto-warning" class="overlay-msg">
                <i class="fa-solid fa-lock"></i> SYSTEM LOCKED IN AUTO MODE
            </div>
        </div>
    </div>

    <script>
        let autoMode = true;
        let feederState = false;
        let aeratorState = false;

        async function fetchSensorData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();

                document.getElementById('val-ph').innerText = data.ph;
                document.getElementById('val-do').innerHTML = data.do + ' <span class="unit">mg/L</span>';
                document.getElementById('val-turb').innerHTML = data.turbidity + ' <span class="unit">NTU</span>';
                document.getElementById('val-temp').innerHTML = data.temp + ' <span class="unit">°C</span>';
                document.getElementById('val-sound').innerText = data.sound_level;
                document.getElementById('sync-time').innerText = data.last_update;

                if (autoMode !== data.auto_mode) {
                    autoMode = data.auto_mode;
                    document.getElementById('auto-mode-toggle').checked = autoMode;
                }
                
                feederState = data.feeder_active;
                aeratorState = data.aerator_active;
                
                updateUI();
            } catch (err) {}
        }

        function updateUI() {
            document.getElementById('mode-text').innerText = autoMode ? "AUTO" : "MANUAL";
            document.getElementById('mode-text').style.color = autoMode ? "var(--neon-green)" : "#f59e0b";

            const fBtn = document.getElementById('feeder-btn');
            const aBtn = document.getElementById('aerator-btn');
            const warning = document.getElementById('auto-warning');

            fBtn.innerHTML = `<i class="fa-solid fa-power-off"></i> Feeder: ${feederState ? "ON" : "OFF"}`;
            fBtn.className = "cyber-btn " + (feederState ? "btn-on" : "btn-off");

            aBtn.innerHTML = `<i class="fa-solid fa-power-off"></i> Aerator: ${aeratorState ? "ON" : "OFF"}`;
            aBtn.className = "cyber-btn " + (aeratorState ? "btn-on" : "btn-off");

            if (autoMode) {
                fBtn.disabled = true; aBtn.disabled = true;
                warning.style.display = "block";
            } else {
                fBtn.disabled = false; aBtn.disabled = false;
                warning.style.display = "none";
            }
        }

        async function toggleAutoMode() {
            autoMode = document.getElementById('auto-mode-toggle').checked;
            await fetch('/api/control', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: "auto_mode", state: autoMode })
            });
            updateUI();
        }

        async function toggleDevice(device) {
            if (autoMode) return;
            let newState = device === 'feeder' ? !feederState : !aeratorState;
            await fetch('/api/control', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: device, state: newState })
            });
            fetchSensorData();
        }

        document.getElementById('auto-mode-toggle').checked = autoMode;
        setInterval(fetchSensorData, 1000);
        fetchSensorData();
    </script>
</body>
</html>
